setupVersion: 3
modelRoles:
  default: mistral/deepseek-v4-1-flash-1017:max
  smol: router/ag/gemini-3.8-flash:low
  image: google-antigravity/gemini-3.1-flash-image
  vision: router/ag/gemini-3.8-flash:high
  judge: opencode-zen/jev-1.13-free
  advisor: google-antigravity/gemini-3.8-flash:high
compaction:
  enabled: false
memory:
  backend: "off"
theme:
  dark: dark-monokai
symbolPreset: nerd
statusLine:
  preset: custom
  separator: powerline
  contextLine: "off"
  sessionAccent: true
  compactThinkingLevel: false
  showHookStatus: false
  leftSegments:
    - time_spent
    - path
    - model
  rightSegments:
    - token_in
    - cache_read
    - cache_hit
    - token_out
    - cost
    - token_rate
  segmentOptions:
    path:
      abbreviate: true
composer:
  shape: omz
  tokenRate: false
update:
  auto: true
