setupVersion: 2
modelRoles:
  default: opencode-go/deepseek-v4.1-flash
  smol: opencode-go/deepseek-v4.1-flash:low
compaction:
  enabled: false
memory:
  backend: "off"
theme:
  dark: dark-monokai
symbolPreset: nerd
statusLine:
  preset: custom
  separator: powerline
  contextLine: "off"
  sessionAccent: true
  compactThinkingLevel: false
  showHookStatus: false
  leftSegments:
    - time_spent
    - path
    - model
  rightSegments:
    - token_rate
  segmentOptions:
    path:
      abbreviate: true
composer:
  shape: omz
  tokenRate: true